[package]
name = "xilulu_core"
version = "0.1.0"
edition = "2021"
description = "Core business logic, abstract state, models, and network calls independent of Dioxus UI"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.28", features = ["sync", "time"] }
rust-i18n = "3.1"
async-trait = "0.1.80"
tracing = "0.1"
