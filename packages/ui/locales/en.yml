docs:
  terms_title: "Terms of Service"
  privacy_title: "Privacy Policy"
  last_updated: "Last updated: October 2026"

  terms_h1: "1. Acceptance of Terms"
  terms_p1: "By creating an account, accessing, or using Xilulu services, you agree to be bound by these Terms of Service. If you do not agree to all the terms and conditions outlined in this agreement, you may not access the website or use any services."
  terms_h2: "2. User Accounts and Responsibilities"
  terms_p2: "You are responsible for safeguarding your account credentials, including your password or one-time passcodes. You agree to notify us immediately of any unauthorized use of your account. Xilulu will not be liable for any loss or damage arising from your failure to comply with this security obligation."
  terms_h3: "3. Acceptable Use Policy"
  terms_p3: "Users must not use Xilulu to transmit any content that is illegal, harmful, threatening, abusive, harassing, defamatory, or otherwise objectionable. We reserve the right to suspend or terminate accounts that violate these community standards without prior notice."
  terms_h4: "4. Intellectual Property Rights"
  terms_p4: "All content, features, and functionality available through our services (including but not limited to software, text, displays, images, and the design) are owned by Xilulu and are protected by international copyright, trademark, and other intellectual property laws."
  terms_h5: "5. Disclaimer of Warranties"
  terms_p5: "The services are provided on an 'AS IS' and 'AS AVAILABLE' basis. Xilulu makes no representations or warranties of any kind, express or implied, regarding the continuous operation of the platform or the information, content, and materials included therein."
  terms_h6: "6. Limitation of Liability"
  terms_p6: "In no event shall Xilulu, nor its directors, employees, partners, agents, or suppliers, be liable for any indirect, incidental, special, consequential or punitive damages, including without limitation, loss of profits, data, or goodwill, resulting from your access to or use of the service."

  privacy_h1: "1. Information We Collect"
  privacy_p1: "We collect information that you manually provide (such as your nickname, phone number, and email address), as well as automated diagnostic metadata automatically retrieved when you access our platform. This includes your IP address, browser type, device information, and usage patterns."
  privacy_h2: "2. How We Use Your Information"
  privacy_p2: "Your information is utilized to authenticate your identity, provide and maintain our services, personalize your user experience, and communicate important account-related updates. We also analyze aggregated metrics to improve our application's performance."
  privacy_h3: "3. Information Sharing and Disclosure"
  privacy_p3: "We respect your privacy and do not sell your personal data to third parties. We may share necessary information with trusted third-party service providers (such as SMS/Email delivery gateways and cloud hosting providers) strictly under confidentiality agreements to operate our infrastructure."
  privacy_h4: "4. Data Security"
  privacy_p4: "Xilulu implements robust, industry-standard security measures, including end-to-end encryption for in-transit data and secure storage protocols, to protect your personal information against unauthorized access, alteration, disclosure, or destruction."
  privacy_h5: "5. User Rights and Choices"
  privacy_p5: "You retain the right to access, update, or permanently delete your personal information at any time through your account settings. Depending on your jurisdiction, you may also have the right to request a digital copy of your data or formally object to specific processing activities."
