docs:
  terms_title: "服务条款"
  privacy_title: "隐私政策"
  last_updated: "最后更新：2026年10月"

  terms_h1: "1. 接受条款"
  terms_p1: "通过创建账号、访问或使用 Xilulu 提供的服务，即表示您同意受本服务条款的约束。如果您不同意本协议中的任何条款和条件，您无权访问本网站或使用任何服务。"
  terms_h2: "2. 用户账号与责任"
  terms_p2: "您有责任妥善保管您的账号凭证（包括密码和一次性验证码）。如发现任何未经授权使用您账号的行为，您同意立即通知我们。因您未履行此安全义务而导致的任何损失或损害，Xilulu 概不负责。"
  terms_h3: "3. 可接受使用政策"
  terms_p3: "用户不得利用 Xilulu 传播任何非法、有害、威胁、辱骂、骚扰、诽谤或其他令人反感的内容。我们保留在不事先通知的情况下，暂停或终止违反社区标准账号的权利。"
  terms_h4: "4. 知识产权"
  terms_p4: "通过我们的服务提供的所有内容、功能集（包括但不限于软件、文本、显示界面、图像和设计）均归 Xilulu 所有，并受国际版权、商标和其他知识产权法的保护。"
  terms_h5: "5. 免责声明"
  terms_p5: "我们的服务按 “原样” 和 “可用” 的基础提供。Xilulu 对平台的持续运行或其中包含的信息、内容和材料不做任何明示或暗示的陈述或保证。"
  terms_h6: "6. 责任限制"
  terms_p6: "在任何情况下，Xilulu 及其董事、员工、合作伙伴、代理商或供应商均不对因您访问或使用本服务而导致的任何间接、附带、特殊、后果性或惩罚性损害负责，包括但不限于利润、数据或商誉的损失。"

  privacy_h1: "1. 我们收集的信息"
  privacy_p1: "我们收集您主动提供的信息（如您的昵称、手机号和邮箱地址），以及您访问我们平台时自动捕获的诊断元数据，包括但不限于您的 IP 地址、浏览器类型、设备详细信息和使用模式。"
  privacy_h2: "2. 信息的使用方式"
  privacy_p2: "您的信息主要用于验证您的身份、提供和维护我们的服务、个性化您的用户体验，以及传达重要的账号相关更新通知。同时，我们也会分析汇总指标以优化应用的性能表现。"
  privacy_h3: "3. 信息的共享与披露"
  privacy_p3: "我们尊重您的隐私，绝不向第三方出售您的个人数据。我们仅会在严格保密协议的前提下，为了维持基础设施的运行，与值得信赖的第三方服务提供商（如短信/邮件发送网关和云托管服务商）共享必要信息。"
  privacy_h4: "4. 数据安全"
  privacy_p4: "Xilulu 实施强大的行业标准安全措施，包括数据传输的端到端加密协议和安全存储方案，以保护您的个人信息绝受未经授权的访问、篡改、披露或销毁。"
  privacy_h5: "5. 用户的权利与选择"
  privacy_p5: "您始终可以通过账号设置访问、更新或永久删除您的个人信息。根据您所在司法管辖区的法律，您可能还有权请求获取您的数据副本，或正式拒绝对您个人数据的特定处理行为。"
