[package]
name = "xilulu_im_sdk"
version = "0.1.0"
edition = "2021"
description = "Core business logic, abstract state, models, and network calls independent of Dioxus UI"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
reqwest-websocket = "0.4.2"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.28", features = ["sync", "time", "macros"] }
sqlx = { version = "0.8.0", features = ["sqlite", "runtime-tokio-rustls", "chrono", "uuid"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust-i18n = "3.1"
async-trait = "0.1.80"
tracing = "0.1"
urlencoding = "2.1"
