[package]
name = "console"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["web"]
web = ["dioxus/web"]
