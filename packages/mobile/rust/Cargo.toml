[package]
name = "rust_lib_wechat_flutter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
xilulu_core = { path = "../../core" }
flutter_rust_bridge = "=2.12.0" # You might need to adjust this depending on codegen version
tokio = { version = "1.28", features = ["rt", "macros", "sync"] }
serde_json = "1.0.149"
serde = { version = "1.0", features = ["derive"] }
lazy_static = "1.5.0"
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }

