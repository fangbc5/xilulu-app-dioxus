[package]
name = "rust_lib_wechat_flutter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
xilulu_im_sdk = { path = "../../xilulu-im-sdk" }
flutter_rust_bridge = "=2.12.0" # You might need to adjust this depending on codegen version
tokio = { version = "1.28", features = ["rt", "macros", "sync"] }
serde_json = "1.0.149"
serde = { version = "1.0", features = ["derive"] }
lazy_static = "1.5.0"
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
# 忽略 Flutter Rust Bridge 宏产生的 cfg 警告 (Rust 1.80+ 引入的意外 cfg 检查)
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }
